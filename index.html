
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Srećna godišnjica ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #54152f, #190713 65%, #090308);
    color: white;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 650px;
    padding: 45px 25px;
    position: relative;
    z-index: 2;
    animation: appear 2s ease;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(55px, 11vw, 90px);
    color: #ffb5ce;
    text-shadow: 0 0 20px #ff4f91, 0 0 50px #ff1765;
    margin-bottom: 15px;
}

.subtitle {
    font-size: 15px;
    color: #f6cbd9;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.heart {
    font-size: 65px;
    display: inline-block;
    animation: heartbeat 1.5s infinite;
    filter: drop-shadow(0 0 20px #ff367c);
}

button {
    background: linear-gradient(135deg, #ff477e, #a51b50);
    border: 1px solid #ff9fbd;
    color: white;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 25px #ff367c66;
    transition: .3s;
    margin-top: 10px;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px #ff367c;
}

#surprise {
    display: none;
    margin-top: 25px;
    color: #ffbfd4;
    font-size: 17px;
    line-height: 2;
    animation: appear 1s ease;
}

.floating-heart {
    position: fixed;
    bottom: -30px;
    color: #ff5c91;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">❤️</div>

    <h1>Srećna godišnjica</h1>

    <div class="subtitle">TI I JA · ZAUVEK</div>

    <button onclick="showSurprise()">
        Klikni za iznenađenje 💌
    </button>

    <div id="surprise">
        Ti si moj omiljeni deo svakog dana. 🥹❤️
        <br>
        Ako bih mogao ponovo da biram,
        svaki put bih izabrao tebe. 💗
        <br>
        <span style="font-size:25px;">∞ ❤️</span>
    </div>
</div>

<script>
function showSurprise() {
    const surprise = document.getElementById("surprise");
    surprise.style.display = "block";
    document.querySelector("button").style.display = "none";
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.innerHTML = Math.random() > 0.5 ? "❤️" : "💕";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (5 + Math.random() * 6) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 11000);
}

setInterval(createHeart, 450);
</script>

</body>
</html>
